services:
  redis:
    image: redis:alpine
    container_name: easy-catalogs-redis
    command: ["redis-server", "--save", "60", "1"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - redis-data:/data

  easy-catalogs:
    build: .
    container_name: easy-catalogs
    ports:
      - "7171:7171"
    environment:
      - PORT=7171
      - ADDON_URL=http://localhost:7171
      - NODE_ENV=production
      - REDIS_URL=redis://redis:6379
      - CACHE_TYPE=hybrid
      - NODE_OPTIONS=--dns-result-order=ipv4first
    cap_add:
      - NET_ADMIN
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=1
      - net.ipv6.conf.default.disable_ipv6=1
    devices:
      - /dev/net/tun
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./data:/app/data

volumes:
  redis-data:
