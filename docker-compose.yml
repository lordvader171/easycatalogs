services:
  redis:
    image: redis:alpine
    container_name: easy-catalogs-redis
    command: ["redis-server", "--save", "60", "1"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - redis-data:/data

  trawl:
    image: ghcr.io/germondai/trawl:latest
    container_name: easy-catalogs-trawl
    restart: unless-stopped
    shm_size: 1gb
    cap_add:
      - SYS_ADMIN
    security_opt:
      - seccomp:unconfined
    environment:
      - REDIS_URL=redis://redis:6379
      - BROWSER_POOL_SIZE=2
    depends_on:
      redis:
        condition: service_healthy

  easy-catalogs:
    build: .
    container_name: easy-catalogs
    ports:
      - "7171:7171"
    environment:
      - PORT=7171
      - ADDON_URL=http://localhost:7171
      - NODE_ENV=production
      - REDIS_URL=redis://redis:6379
      - TRAWL_URL=http://trawl:8191
      - CACHE_TYPE=hybrid
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      trawl:
        condition: service_started
    volumes:
      - ./data:/app/data

volumes:
  redis-data:
