services:
  redis:
    image: redis:alpine
    container_name: easy-catalogs-redis
    command: ["redis-server", "--save", "60", "1"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - redis-data:/data

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: easy-catalogs-flaresolverr
    restart: unless-stopped
    environment:
      - LOG_LEVEL=info
      - TZ=Europe/Rome

  easy-catalogs:
    build: .
    container_name: easy-catalogs
    ports:
      - "7171:7171"
    environment:
      - PORT=7171
      - ADDON_URL=http://localhost:7171
      - NODE_ENV=production
      - REDIS_URL=redis://redis:6379
      - FLARESOLVERR_URL=http://flaresolverr:8191
      - CACHE_TYPE=hybrid
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      flaresolverr:
        condition: service_started
    volumes:
      - ./data:/app/data

volumes:
  redis-data:
